name: Sync Playgrnd Stock

on:
  workflow_dispatch:
  push:
    paths:
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.webp"
      - "*.gif"
      - "*.avif"
      - "*.bmp"
      - "*.tif"
      - "*.tiff"
      - "*.mp4"
      - "*.webm"
      - "*.mov"
      - "*.m4v"
      - "*.avi"
      - "*.mkv"

permissions:
  contents: write

jobs:
  sync-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Process root media
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob

          mkdir -p static_images videos

          hash8() {
            sha256sum "$1" | cut -c1-8
          }

          unique_name() {
            local file="$1"
            local base ext hash
            base="$(basename "$file")"
            ext="${base##*.}"
            base="${base%.*}"
            hash="$(hash8 "$file")"
            printf '%s-%s.%s' "$base" "$hash" "$ext"
          }

          # Images: preserve full resolution and original format.
          for file in *.png *.jpg *.jpeg *.webp *.gif *.avif *.bmp *.tif *.tiff; do
            [ -f "$file" ] || continue

            name="$(unique_name "$file")"
            destination="static_images/$name"

            if [ -e "$destination" ]; then
              if cmp -s "$file" "$destination"; then
                echo "Identical image already exists: $destination"
                rm "$file"
              else
                echo "Hash/name collision for $file -> $destination"
                exit 1
              fi
            else
              echo "Moving image: $file -> $destination"
              mv "$file" "$destination"
            fi
          done

          # Videos: preserve original video and create a lightweight GIF preview.
          for file in *.mp4 *.webm *.mov *.m4v *.avi *.mkv; do
            [ -f "$file" ] || continue

            base="$(basename "$file")"
            ext="${base##*.}"
            stem="${base%.*}"
            hash="$(hash8 "$file")"

            video_name="${stem}-${hash}.${ext}"
            gif_name="${stem}-${hash}.gif"

            video_destination="videos/$video_name"
            gif_destination="static_images/$gif_name"
            tmp_gif="$(mktemp --suffix=.gif)"

            echo "Creating lightweight GIF preview for: $file"

            # Preview only: max 800px wide, 12fps, optimized palette.
            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -vf "fps=12,scale='min(800,iw)':-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a" \
              -loop 0 \
              "$tmp_gif"

            if [ ! -s "$tmp_gif" ]; then
              echo "GIF creation failed; leaving original untouched: $file"
              rm -f "$tmp_gif"
              exit 1
            fi

            # Do not overwrite an existing GIF with different content.
            if [ -e "$gif_destination" ]; then
              if cmp -s "$tmp_gif" "$gif_destination"; then
                echo "Identical GIF preview already exists: $gif_destination"
                rm -f "$tmp_gif"
              else
                echo "GIF name collision: $gif_destination"
                rm -f "$tmp_gif"
                exit 1
              fi
            else
              mv "$tmp_gif" "$gif_destination"
            fi

            # Only move the original after the preview was created successfully.
            if [ -e "$video_destination" ]; then
              if cmp -s "$file" "$video_destination"; then
                echo "Identical video already exists: $video_destination"
                rm "$file"
              else
                echo "Video name collision: $video_destination"
                exit 1
              fi
            else
              echo "Moving video: $file -> $video_destination"
              mv "$file" "$video_destination"
            fi
          done

      - name: Update index.html
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import html
          import re
          from urllib.parse import quote

          index = Path("index.html")
          images = Path("static_images")

          text = index.read_text(encoding="utf-8")

          start_marker = "<!-- PLAYGRND-STOCK:START -->"
          end_marker = "<!-- PLAYGRND-STOCK:END -->"

          if start_marker not in text or end_marker not in text:
              raise SystemExit("Gallery markers are missing from index.html")

          raw_base = (
              "https://raw.githubusercontent.com/"
              "caave24/playgrnd-stock/refs/heads/main"
          )

          image_exts = {
              ".png", ".jpg", ".jpeg", ".webp", ".gif",
              ".avif", ".bmp", ".tif", ".tiff"
          }

          files = sorted(
              p for p in images.iterdir()
              if p.is_file() and p.suffix.lower() in image_exts
          )

          blocks = []

          for path in files:
              filename = path.name
              encoded = quote(filename)
              safe_name = html.escape(filename, quote=True)
              image_url = f"{raw_base}/static_images/{encoded}"

              # A generated GIF whose same stem exists in /videos/ is a video preview.
              is_video_preview = (
                  path.suffix.lower() == ".gif"
                  and any(
                      (Path("videos") / f"{path.stem}.{ext}").exists()
                      for ext in ("mp4", "webm", "mov", "m4v", "avi", "mkv")
                  )
              )

              if is_video_preview:
                  video_file = next(
                      (
                          Path("videos") / f"{path.stem}.{ext}"
                          for ext in ("mp4", "webm", "mov", "m4v", "avi", "mkv")
                          if (Path("videos") / f"{path.stem}.{ext}").exists()
                      ),
                      None
                  )

                  video_url = (
                      f"{raw_base}/videos/{quote(video_file.name)}"
                  )

                  block = (
                      '    <div class="Cell -6of12 asset video-asset">\n'
                      f'      <a class="asset-link" href="{video_url}" '
                      f'download="{html.escape(video_file.name, quote=True)}" '
                      f'title="Download {html.escape(video_file.name, quote=True)}">\n'
                      "        <figure>\n"
                      f'          <img src="{image_url}" alt="{safe_name}" loading="lazy">\n'
                      f'          <figcaption>{safe_name} · DOWNLOAD VIDEO</figcaption>\n'
                      "        </figure>\n"
                      "      </a>\n"
                      "    </div>"
                  )
              else:
                  block = (
                      '    <div class="Cell -6of12 asset">\n'
                      f'      <a class="asset-link" href="{image_url}" '
                      f'download="{safe_name}" title="Download {safe_name}">\n'
                      "        <figure>\n"
                      f'          <img src="{image_url}" alt="{safe_name}" loading="lazy">\n'
                      f"          <figcaption>{safe_name}</figcaption>\n"
                      "        </figure>\n"
                      "      </a>\n"
                      "    </div>"
                  )

              blocks.append(block)

          if blocks:
              gallery = "\n".join(blocks)
          else:
              gallery = (
                  '    <div class="empty Cell -12of12">'
                  "No stock media yet."
                  "</div>"
              )

          replacement = f"{start_marker}\n{gallery}\n{end_marker}"
          pattern = re.escape(start_marker) + r".*?" + re.escape(end_marker)

          text = re.sub(pattern, replacement, text, flags=re.DOTALL)
          index.write_text(text, encoding="utf-8")

          print(f"Indexed {len(files)} gallery asset(s).")
          PY

      - name: Commit synchronized assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static_images videos index.html

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Sync playgrnd stock assets"
          git push
