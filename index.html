<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playgrnd stock</title>
  <link rel="stylesheet" href="./grd.css">

  <style>
    html, body { margin: 0; padding: 0; background: #fff; color: #111; font-family: sans-serif; }
    header { padding: 18px; border-bottom: 1px solid #111; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 56px); line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
    .subtitle { margin-top: 6px; font-size: 14px; }
    .asset { padding: 8px; }
    .asset-link { display: block; color: inherit; text-decoration: none; }
    figure { margin: 0; border: 1px solid #111; background: #f5f5f5; }
    img { width: 100%; height: auto; max-height: 80vh; object-fit: contain; display: block; }
    figcaption { padding: 8px; border-top: 1px solid #111; font-size: 12px; overflow-wrap: anywhere; }
    .asset-link:hover figure { outline: 3px solid #111; outline-offset: -3px; }
    .empty { padding: 30px 18px; font-size: 14px; }
  </style>
</head>

<body>
  <header>
    <h1>playgrnd stock</h1>
    <div class="subtitle">Images, GIFs, and generated video previews.</div>
  </header>

  <main class="Grid -top">
    <!-- PLAYGRND-STOCK:START -->
    <div class="empty Cell -12of12">
      Add an image or video to the repository root and GitHub Actions will index it here.
    </div>
    <!-- PLAYGRND-STOCK:END -->
  </main>
</body>
</html>
